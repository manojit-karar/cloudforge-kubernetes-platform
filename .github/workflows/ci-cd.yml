name: CloudForge CI

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          printf '%s' "$DOCKER_PASSWORD" | tr -d '\r\n' | docker login \
            --username "$(printf '%s' "$DOCKER_USERNAME" | tr -d '\r\n')" \
            --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t manojitkarar/cloudforge-app:latest ./app

      - name: Push Docker Image
        run: |
          docker push manojitkarar/cloudforge-app:latest